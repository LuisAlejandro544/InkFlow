<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>InkFlow Studio</title>
    <meta name="description" content="Aplicación de dibujo e ilustración digital móvil acelerada por WebGPU y WebAssembly en formato PWA nativa." />
    <meta property="og:title" content="InkFlow Studio" />
    <meta property="og:description" content="Aplicación de dibujo e ilustración digital móvil acelerada por WebGPU y WebAssembly en formato PWA nativa." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#121316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InkFlow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        font-size: 16px;
      }
      html {
        font-size: 16px !important;
        -webkit-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
        -moz-text-size-adjust: 100% !important;
        -ms-text-size-adjust: 100% !important;
      }
      html, body {
        background-color: #121316;
        color: #e5e7eb;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior-y: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
      }
      *, *::before, *::after {
        -webkit-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
      }
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: #121316;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#121316;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:20px;">
        <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(245,158,11,0.3);margin-bottom:16px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 11 3 3L10 25l-7-1 1-7Z" />
            <circle cx="13.5" cy="6.5" r="2.5" />
          </svg>
        </div>
        <h1 style="font-size:18px;font-weight:700;margin:0 0 6px 0;letter-spacing:-0.02em;">InkFlow Studio</h1>
        <p style="font-size:12px;color:#9ca3af;margin:0 0 20px 0;">Iniciando motor gráfico...</p>
        <div style="width:36px;height:36px;border:3px solid #27272a;border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
