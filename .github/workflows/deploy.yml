name: InkFlow - Compilar WebAssembly (C++, Rust, Kotlin) y Desplegar a Cloudflare Pages

# Activación EXCLUSIVAMENTE manual con soporte para Entorno Dual (Producción vs Vista Previa)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue en Cloudflare Pages'
        required: true
        type: choice
        options:
          - 'production'
          - 'preview'
        default: 'production'
      project_name:
        description: 'Nombre del proyecto en Cloudflare Pages'
        required: false
        default: 'inkflow'
      build_native_cores:
        description: 'Compilar núcleos nativos C++23 y Rust a WebAssembly con wasm-opt'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Compilar Wasm & Desplegar InkFlow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Descarga del código fuente del repositorio
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      # 2. Configurar toolchain de Rust con soporte nativo para WebAssembly
      - name: Configurar Rust Toolchain (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Caché de Rust para compilaciones instantáneas
      - name: Caché de Rust Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/rust-core/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('src/rust-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      # 4. Compilar núcleo de Rust a WebAssembly (.wasm)
      - name: Compilar Rust Core a WebAssembly (wasm32)
        working-directory: src/rust-core
        run: |
          cargo build --target wasm32-unknown-unknown --release
          echo "✅ Núcleo Rust compilado exitosamente a Wasm"

      # 5. Configurar Emscripten para compilar C++23 moderno (ISO/IEC 14882:2023)
      - name: Configurar Emscripten SDK (C++23)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      # 6. Compilar núcleo C++23 con CMake + SIMD128 a WebAssembly
      - name: Compilar C++23 Core con Emscripten a Wasm
        run: |
          mkdir -p build-cpp
          emcmake cmake -B build-cpp -S src/cpp-core -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cpp --config Release
          echo "✅ Núcleo C++23 compilado exitosamente a Wasm con SIMD128"

      # 7. Instalar Binaryen para Optimización Extrema con wasm-opt (-O3 + SIMD)
      - name: Instalar Binaryen (wasm-opt)
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          wasm-opt --version

      # 8. Optimización Extrema y Poda Profunda de Wasm con wasm-opt estilo R8 (-O3 + SIMD + DCE + Strip)
      - name: Optimizar y podar binarios WebAssembly con wasm-opt
        run: |
          echo "⚡ Optimizando y podando binarios Wasm (DCE, Strip Debug, Vacuum)..."
          WASM_OPT_FLAGS="-O3 --enable-simd --enable-bulk-memory --strip-debug --strip-dwarf --strip-producers --dce --vacuum"
          if [ -f src/rust-core/target/wasm32-unknown-unknown/release/inkflow_rust_core.wasm ]; then
            wasm-opt $WASM_OPT_FLAGS \
              src/rust-core/target/wasm32-unknown-unknown/release/inkflow_rust_core.wasm \
              -o src/rust-core/target/wasm32-unknown-unknown/release/inkflow_rust_core.wasm
            echo "✅ Núcleo Rust podado y optimizado con wasm-opt"
          fi
          if [ -f build-cpp/libinkflow_cpp_core.wasm ]; then
            wasm-opt $WASM_OPT_FLAGS \
              build-cpp/libinkflow_cpp_core.wasm \
              -o build-cpp/libinkflow_cpp_core.wasm
            echo "✅ Núcleo C++23 podado y optimizado con wasm-opt"
          fi

      # 9. Configurar Java JDK para ecosistema Kotlin/Wasm
      - name: Configurar Java 21 (Temurin) para Kotlin/Wasm
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 10. Configurar Node.js 22
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 10.1. Caché de dependencias npm resiliente (sin requerir package-lock.json obligatorio)
      - name: Caché de dependencias npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 11. Caché de compilación Vite para ultra velocidad
      - name: Caché de compilador Vite
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-cache-${{ hashFiles('package.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-vite-cache-${{ hashFiles('package.json') }}-
            ${{ runner.os }}-vite-cache-

      # 12. Instalación limpia y resiliente de dependencias
      - name: Instalar dependencias de la PWA
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # 13. Validación de Tipos TypeScript y Linter Estricto Pre-Deploy
      - name: Validar tipos TypeScript (npm run lint)
        run: npm run lint

      # 14. Ejecución determinista de la suite completa de pruebas unitarias (46 tests: Motor + SQLite Wasm OPFS)
      - name: Ejecutar pruebas unitarias deterministas (node:test)
        run: npx tsx --test src/engine/engine.test.ts src/storage/storage.test.ts

      # 15. Compilación estática de la Progressive Web App con Poda de Logs (drop_console)
      - name: Compilar PWA estática con Tree-Shaking y Poda de Logs
        run: npm run build
        env:
          NODE_ENV: production
          CI: true

      # 15.1. Resource & Artifact Shrinking estilo R8 (Limpieza de código basura pre-deploy)
      - name: Resource & Artifact Shrinking (Poda y limpieza pre-deploy estilo R8)
        run: |
          echo "🧹 Ejecutando poda de artefactos huérfanos y código basura en dist/..."
          # Eliminar cualquier source map remanente (*.map)
          find dist/ -type f -name "*.map" -delete
          # Eliminar archivos temporales o respaldos
          find dist/ -type f -name "*.tmp" -delete
          find dist/ -type f -name "*.bak" -delete
          find dist/ -type f -name ".DS_Store" -delete
          find dist/ -type f -name "Thumbs.db" -delete
          echo "✅ Directorio dist/ saneado, podado y listo sin código basura"

      # 16. Validación de Integridad PWA y Cabeceras COOP/COEP para SQLite OPFS
      - name: Validar Integridad PWA y Cabeceras COOP/COEP
        run: |
          echo "🔍 Validando integridad de archivos generados en dist/..."
          test -f dist/index.html || { echo "❌ Falta dist/index.html"; exit 1; }
          test -f dist/sw.js || { echo "❌ Falta Service Worker dist/sw.js"; exit 1; }
          test -f dist/_headers || { echo "❌ Falta dist/_headers"; exit 1; }
          grep -q "Cross-Origin-Opener-Policy" dist/_headers || { echo "❌ Falta COOP en dist/_headers"; exit 1; }
          grep -q "Cross-Origin-Embedder-Policy" dist/_headers || { echo "❌ Falta COEP en dist/_headers"; exit 1; }
          echo "✅ Integridad PWA y cabeceras COOP/COEP validadas exitosamente"

      # 17. Determinar rama y modo de despliegue (Producción vs Vista Previa Aislada)
      - name: Configurar entorno de despliegue
        id: deploy_env
        run: |
          if [ "${{ github.event.inputs.environment }}" = "preview" ]; then
            BRANCH_NAME="preview-${{ github.run_id }}"
            MODE_NAME="Vista Previa Aislada (Preview)"
          else
            BRANCH_NAME="main"
            MODE_NAME="Producción (Production)"
          fi
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "mode=${MODE_NAME}" >> $GITHUB_OUTPUT

      # 18. Despliegue directo a Cloudflare Pages con Wrangler
      - name: Desplegar a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            npx wrangler pages project create ${{ github.event.inputs.project_name || 'inkflow' }} --production-branch=main || true
          command: pages deploy dist --project-name=${{ github.event.inputs.project_name || 'inkflow' }} --branch=${{ steps.deploy_env.outputs.branch }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 19. Panel de Resumen Ejecutivo en GitHub ($GITHUB_STEP_SUMMARY)
      - name: Generar Panel de Resumen Ejecutivo en GitHub
        if: always()
        run: |
          PROJECT_NAME="${{ github.event.inputs.project_name || 'inkflow' }}"
          BRANCH_NAME="${{ steps.deploy_env.outputs.branch || 'main' }}"
          MODE_NAME="${{ steps.deploy_env.outputs.mode || 'Producción' }}"
          
          if [ "${BRANCH_NAME}" = "main" ]; then
            PAGE_URL="https://${PROJECT_NAME}.pages.dev"
          else
            PAGE_URL="https://${BRANCH_NAME}.${PROJECT_NAME}.pages.dev"
          fi
          
          DIST_SIZE="N/A"
          if [ -d dist ]; then
            DIST_SIZE=$(du -sh dist | cut -f1)
          fi

          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🎨 InkFlow Studio - Resumen de Despliegue en Cloudflare Pages

          | Métrica / Parámetro | Detalle de Ejecución |
          |---|---|
          | 🌐 **Entorno de Despliegue** | **${MODE_NAME}** |
          | 🔗 **Enlace Directo PWA** | [Abrir InkFlow Studio (${PAGE_URL})](${PAGE_URL}) |
          | 🌿 **Rama Cloudflare** | \`${BRANCH_NAME}\` |
          | 🧪 **Pruebas Automatizadas** | ✅ **46 tests deterministas pasando** (Motor + SQLite OPFS) |
          | ⚡ **Optimización Wasm** | ✅ **Binaryen wasm-opt (-O3 + SIMD)** aplicado |
          | 🔒 **Aislamiento SQLite OPFS** | ✅ **COOP / COEP (Cross-Origin Isolation)** activo |
          | 📦 **Peso Total del Bundle** | **${DIST_SIZE}** |
          | 📱 **Modo PWA** | Standalone con Workbox Precaching (10 MB) |

          ---
          > 📱 **Instrucción para Teléfono Móvil:** Pulsa sobre el enlace anterior en tu teléfono para abrir InkFlow Studio y selecciona **"Instalar PWA"** para fijarla en tu pantalla de inicio como una app nativa con soporte 100% offline.
          EOF
