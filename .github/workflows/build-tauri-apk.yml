name: InkFlow - Compilar APK Debug con Tauri v2 (Android)

# Activación EXCLUSIVAMENTE manual para generar el APK Debug de pruebas e instalación en teléfono móvil
on:
  workflow_dispatch:
    inputs:
      enable_cache:
        description: 'Activar caché de Rust, Gradle y npm (Opcional, acelera re-compilaciones)'
        required: false
        type: boolean
        default: false
      target_arch:
        description: 'Arquitectura de CPU del APK Debug'
        required: true
        type: choice
        options:
          - 'universal' # APK compatible con 64 bits (arm64-v8a) y 32 bits (armeabi-v7a)
          - 'arm64'     # Solo teléfonos modernos de 64 bits (aarch64-linux-android)
          - 'armv7'     # Teléfonos de 32 bits (armv7-linux-androideabi)
          - 'all'       # Compila todos los targets (arm64, armv7, x86_64)
        default: 'universal'

permissions:
  contents: read

jobs:
  build-tauri-apk-debug:
    name: Compilar APK Debug (Tauri v2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Descarga del código fuente del repositorio
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      # 2. Configurar Java JDK 17 (LTS para Android Gradle)
      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Android SDK y NDK preinstalados en GitHub Actions
      - name: Configurar Android SDK y NDK
        run: |
          ANDROID_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          
          # Detectar el NDK preinstalado en el runner de GitHub (preferir NDK 26/27 LTS)
          if [ -d "$ANDROID_ROOT/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_ROOT/ndk" -maxdepth 1 \( -name "26.*" -o -name "27.*" \) | sort -V | tail -n 1)
            if [ -z "$NDK_PATH" ]; then
              NDK_PATH=$(find "$ANDROID_ROOT/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
            fi
            echo "✅ NDK preinstalado encontrado en: $NDK_PATH"
          else
            echo "⚠️ Instalando NDK mediante sdkmanager..."
            yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_ROOT/ndk/26.1.10909125"
          fi
          
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_ROOT/platform-tools:$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_ENV

          echo "📋 Aceptando licencias de Android SDK..."
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # 5. Configurar Toolchain de Rust para arquitecturas móviles Android (32 y 64 bits)
      - name: Configurar Rust Toolchain para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      # 6. Configurar Node.js 22
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 7. CACHÉ OPCIONAL (Solo si el usuario lo activa manualmente en el input enable_cache)
      - name: Caché de Rust Cargo (Opcional)
        if: ${{ inputs.enable_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - name: Caché de Gradle (Opcional)
        if: ${{ inputs.enable_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Caché de dependencias npm (Opcional)
        if: ${{ inputs.enable_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 8. Instalación de dependencias del proyecto
      - name: Instalar dependencias del frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # 9. Generar automáticamente la llave de firma Debug de Android (Keystore)
      - name: Generar Keystore Debug de Android automáticamente
        run: |
          echo "🔑 Generando llave Android Debug Keystore si no existe..."
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=InkFlow Studio,C=US"
            echo "✅ Llave Debug Keystore generada con éxito"
          else
            echo "✅ Llave Debug Keystore ya presente"
          fi

      # 10. Compilar el frontend web de InkFlow Studio
      - name: Compilar frontend web (Vite)
        run: npm run build
        env:
          NODE_ENV: production
          CI: true

      # 11. Inicializar contenedor Android de Tauri v2 si no está inicializado
      - name: Inicializar proyecto Android de Tauri
        run: |
          if [ ! -f "src-tauri/gen/android/gradlew" ]; then
            echo "📱 Inicializando estructura Android de Tauri v2 desde cero..."
            rm -rf src-tauri/gen/android
            npx tauri android init --ci --skip-targets-install
            echo "✅ Estructura Android de Tauri v2 inicializada"
          else
            echo "ℹ️ Estructura Android ya presente en src-tauri/gen/android"
          fi

      # 11.1. Aplicar configuraciones nativas en AndroidManifest de forma quirúrgica (largeHeap, hardwareAccelerated, configChanges, windowSoftInputMode y Scoped Storage)
      - name: Aplicar configuraciones nativas en AndroidManifest
        run: |
          echo "🔧 Inyectando configuraciones nativas y permisos en el AndroidManifest generado por Tauri..."
          node -e '
            const fs = require("fs");
            const path = "src-tauri/gen/android/app/src/main/AndroidManifest.xml";
            if (!fs.existsSync(path)) {
              console.error("❌ AndroidManifest.xml no encontrado en:", path);
              process.exit(1);
            }
            let manifest = fs.readFileSync(path, "utf8");

            // 1. Inyectar permisos de Scoped Storage y rendimiento dentro de <manifest>
            const permissions = [
              "<uses-permission android:name=\"android.permission.INTERNET\" />",
              "<uses-permission android:name=\"android.permission.VIBRATE\" />",
              "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
              "<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />",
              "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />"
            ];
            for (const perm of permissions) {
              const permName = perm.match(/android:name="([^"]+)"/)[1];
              if (!manifest.includes(permName)) {
                manifest = manifest.replace(/(<manifest[^>]*>)/, `$1\n    ${perm}`);
              }
            }

            // 2. Inyectar largeHeap, hardwareAccelerated y requestLegacyExternalStorage en <application>
            if (!manifest.includes("android:largeHeap")) {
              manifest = manifest.replace(
                /(<application)/,
                `$1 android:largeHeap="true" android:hardwareAccelerated="true" android:requestLegacyExternalStorage="true"`
              );
            }

            // 3. Inyectar configChanges y windowSoftInputMode en <activity>
            if (manifest.includes("android:configChanges")) {
              manifest = manifest.replace(
                /android:configChanges="[^"]*"/,
                `android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"`
              );
            } else {
              manifest = manifest.replace(
                /(<activity[^>]*)/,
                `$1 android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"`
              );
            }

            if (!manifest.includes("android:windowSoftInputMode")) {
              manifest = manifest.replace(
                /(<activity[^>]*)/,
                `$1 android:windowSoftInputMode="adjustResize|stateHidden"`
              );
            } else {
              manifest = manifest.replace(
                /android:windowSoftInputMode="[^"]*"/,
                `android:windowSoftInputMode="adjustResize|stateHidden"`
              );
            }

            fs.writeFileSync(path, manifest, "utf8");
            console.log("✅ AndroidManifest.xml parcheado con éxito");
          '

          echo "✅ Verificación de atributos nativos en AndroidManifest:"
          grep -E "largeHeap|hardwareAccelerated|configChanges|windowSoftInputMode|READ_MEDIA_IMAGES" src-tauri/gen/android/app/src/main/AndroidManifest.xml

      # 12. Compilación del APK Debug según arquitectura seleccionada
      - name: Compilar APK Debug con Tauri v2
        run: |
          TARGET_CHOICE="${{ inputs.target_arch }}"
          echo "🔨 Compilando APK Debug con arquitectura: $TARGET_CHOICE"

          case "$TARGET_CHOICE" in
            "arm64")
              TARGET_FLAGS="--target aarch64 --split-per-abi"
              ;;
            "armv7")
              TARGET_FLAGS="--target armv7 --split-per-abi"
              ;;
            "universal")
              TARGET_FLAGS="--target aarch64 --target armv7"
              ;;
            "all")
              TARGET_FLAGS="--split-per-abi"
              ;;
            *)
              TARGET_FLAGS="--target aarch64 --split-per-abi"
              ;;
          esac

          echo "Verificando disponibilidad de Tauri CLI..."
          npm run tauri -- --version

          echo "Ejecutando: npx tauri android build --debug --apk --ci --ignore-version-mismatches -v $TARGET_FLAGS"
          npx tauri android build --debug --apk --ci --ignore-version-mismatches -v $TARGET_FLAGS

          echo "✅ Compilación de Tauri v2 finalizada"

      # 13. Recolectar y organizar los APKs generados para descarga
      - name: Recolectar archivos APK Debug
        id: collect_apks
        run: |
          rm -rf build-artifacts
          mkdir -p build-artifacts
          echo "📦 Buscando archivos APK Debug generados..."
          
          # Buscar únicamente dentro de la carpeta oficial de outputs de Gradle de Tauri
          SEARCH_DIR="src-tauri/gen/android/app/build/outputs/apk"
          if [ ! -d "$SEARCH_DIR" ]; then
            SEARCH_DIR="src-tauri"
          fi

          echo "Explorando directorio de salida: $SEARCH_DIR"
          # Filtrar solo archivos .apk finales y asegurar cero duplicación
          find "$SEARCH_DIR" -type f -name "*.apk" | sort -u | while read -r apk_file; do
            APK_NAME=$(basename "$apk_file")
            # Normalizar nombre sin prefijos repetidos
            CLEAN_NAME=$(echo "$APK_NAME" | sed 's/^app-//')
            FINAL_NAME="InkFlow-Studio-${CLEAN_NAME}"
            if [ ! -f "build-artifacts/${FINAL_NAME}" ]; then
              echo "✅ Empaquetando APK único: $apk_file -> build-artifacts/${FINAL_NAME}"
              cp "$apk_file" "build-artifacts/${FINAL_NAME}"
            fi
          done

          COUNT=$(find build-artifacts -type f -name "*.apk" | wc -l)
          echo "Total de APKs recolectados: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No se encontraron archivos APK generados"
            exit 1
          fi

          ls -lh build-artifacts/

      # 14. Subir el APK Debug como artefacto de GitHub Actions para descarga directa
      - name: Subir APK Debug como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: InkFlow-Studio-Debug-APK
          path: build-artifacts/*.apk
          retention-days: 30

      # 15. Generar Panel de Resumen Ejecutivo en GitHub ($GITHUB_STEP_SUMMARY)
      - name: Generar Resumen del APK Debug en GitHub
        if: always()
        run: |
          ARCH="${{ inputs.target_arch }}"
          CACHE_STATUS="${{ inputs.enable_cache && 'Activada ✅' || 'Desactivada ❌ (Compilación Limpia)' }}"

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 📱 InkFlow Studio - APK Debug Generado con Éxito (Tauri v2)

          | Parámetro / Métrica | Valor |
          |---|---|
          | 📦 **Tipo de APK** | **Debug (Listo para probar e instalar)** |
          | ⚙️ **Motor Nativo** | **Tauri v2 Mobile + Android System WebView** |
          | ⚡ **Aceleración** | C++23 Wasm, Rust Wasm & WebGPU |
          | 🏗️ **Arquitectura de CPU** | ${{ inputs.target_arch }} (Soporta 64-bit arm64-v8a y 32-bit armeabi-v7a) |
          | 🔑 **Firma Criptográfica** | Llave Debug generada automáticamente en el runner |
          | 🗄️ **Caché Manual** | ${{ inputs.enable_cache && 'Activada ✅' || 'Desactivada ❌ (Compilación limpia)' }} |
          | 📶 **Soporte Offline** | **100% Nativo (Todos los recursos dentro del APK)** |

          ### 📥 ¿Cómo descargar e instalar el APK en tu teléfono móvil?
          1. En la parte inferior o superior de esta pantalla en GitHub, dirígete a la sección **Artifacts** (Artefactos).
          2. Pulsa sobre **`InkFlow-Studio-Debug-APK`** para descargar el archivo ZIP a tu teléfono.
          3. Descomprime el archivo en tu teléfono y toca el archivo `.apk`.
          4. Si Android te solicita confirmación, pulsa en **"Permitir instalar aplicaciones de esta fuente"**.
          5. ¡Listo! Abre **InkFlow Studio** directamente como una aplicación nativa instalada.

          ---
          > 💡 **Nota para Uptodown o distribución:** Este APK en modo **Debug** te permite probar la aplicación de inmediato sin necesidad de configurar certificados de producción keystore externos.
          EOF
