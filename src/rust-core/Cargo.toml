[package]
name = "inkflow_rust_core"
version = "1.0.0"
edition = "2021"
description = "Motor de bajo nivel en Rust compilable a WebAssembly para InkFlow Studio"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
