[package]
name = "inkflow-studio"
version = "1.0.0"
description = "Estudio de dibujo e ilustración digital móvil acelerado por WebGPU, WebAssembly y C++23"
authors = ["InkFlow Studio"]
edition = "2021"

[lib]
name = "inkflow_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.12", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
